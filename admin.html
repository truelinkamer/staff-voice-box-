<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Staff Voice Box – Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14231c;--mute:#5b6a62;--line:#dde3df;--green:#0b6b3a;--red:#b3202a;--amber:#9a5b0a;--blue:#1d4f91;--redbg:#fbe8e8;--okbg:#e2f0e6;--ambbg:#fbefd9;--bluebg:#e3ecf7;--soft:#f7f9f8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#17201b;--ink:#eef3f0;--mute:#9baba2;--line:#2a3730;--redbg:#3a1b1d;--okbg:#17301f;--ambbg:#3a2c12;--bluebg:#172a40;--soft:#1b2620}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding:16px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
header{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:12px;text-align:center;padding:20px}
header img{max-width:100%;max-height:78px;justify-self:center;background:#fff;border-radius:8px;padding:2px}
header h1{font-size:18px;margin:6px 0;line-height:1.3}
.tag{font-size:11px;letter-spacing:.2em;color:var(--mute)}
.bar3{display:flex;gap:6px;justify-content:center;margin:8px 0}.bar3 i{width:32px;height:3px;background:#d4202c}.bar3 i:nth-child(2){background:#111}.bar3 i:nth-child(3){background:#0b8a4a}
.note{font-size:12px;color:var(--mute)}
h2{font-size:24px;margin:6px 0 2px}.sub{color:var(--mute);margin:0;max-width:560px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);overflow:hidden}
.stats div{padding:16px 18px;border-inline-end:1px solid var(--line)}.stats div:last-child{border:0}
.stats b{font-size:28px;display:block;line-height:1.1}.stats span{color:var(--mute);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:5px}
.split{padding:16px 18px}.split .tr{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line)}
.split .lg{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{padding:18px}.panel h3{margin:0 0 14px;font-size:14px}
.ar{display:grid;grid-template-columns:150px 1fr 24px;gap:10px;align-items:center;margin-bottom:10px;font-size:12px}
.ar .t{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}.ar b{text-align:end}
.wk{display:flex;gap:6px;align-items:flex-end;height:150px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute);gap:4px}
.wk i{display:block;width:100%;background:var(--green);border-radius:3px 3px 0 0;min-height:2px}
.wk div:not(:last-child) i{background:var(--line)}.wk span{white-space:nowrap}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:13px;padding:8px 14px;cursor:pointer;border-inline-end:1px solid var(--line)}
.seg button:last-child{border:0}.seg button[aria-pressed=true]{background:var(--ink);color:var(--card);font-weight:600}
select,input,textarea{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;padding:8px 10px}
.search{width:100%}
.cnt{color:var(--mute);font-size:12px}
.item{padding:16px 18px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}.top .sp{flex:1}
.pill{font-weight:700;border-radius:99px;padding:2px 10px;font-size:12px}
.complaint{background:var(--redbg);color:var(--red)}.suggestion{background:var(--okbg);color:var(--green)}
.High{background:var(--redbg);color:var(--red)}.Medium{background:var(--ambbg);color:var(--amber)}.Low{background:var(--bluebg);color:var(--blue)}
.msg{margin:10px 0 12px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.act{display:flex;gap:12px;align-items:flex-start}
.act .seg button{font-size:12px;padding:8px 12px}
.seg button[data-s=in_progress][aria-pressed=true]{background:var(--amber);color:#fff}
.seg button[data-s=resolved][aria-pressed=true]{background:var(--green);color:#fff}
.seg button[data-s=new][aria-pressed=true]{background:var(--blue);color:#fff}
.act textarea{flex:1;min-height:42px;resize:vertical}
.del{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:12px;padding:10px 4px}.del:hover{color:var(--red)}
.empty,.err{padding:30px;text-align:center;color:var(--mute)}.err{color:var(--red)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.stats div{border-bottom:1px solid var(--line)}.two{grid-template-columns:1fr}.act{flex-direction:column}.act textarea{width:100%}.ar{grid-template-columns:110px 1fr 24px}header{grid-template-columns:64px 1fr 64px}header img{max-height:56px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="card">
    <img src="logo-amer.png" alt="Amer" onerror="this.style.visibility='hidden'">
    <div><div class="tag">STAFF VOICE BOX</div><h1>True Link Government<br>Transaction Center LLC</h1><div class="bar3"><i></i><i></i><i></i></div><div class="note">Management dashboard</div></div>
    <img src="logo-truelink.png" alt="True Link" onerror="this.style.visibility='hidden'">
  </header>
  <div><h2>Dashboard</h2><p class="sub">Everything staff have sent. Entries carry no names. Update the status and write a reply; staff see both when they check with their tracking code.</p></div>
  <div class="card stats" id="stats"></div>
  <div class="card split" id="split"></div>
  <div class="two"><div class="card panel"><h3>By area</h3><div id="areas"></div></div><div class="card panel"><h3>Last 8 weeks</h3><div class="wk" id="weeks"></div></div></div>
  <div class="tools">
    <div class="seg" id="ft"><button data-v="" aria-pressed="true">All</button><button data-v="complaint" aria-pressed="false">Complaints</button><button data-v="suggestion" aria-pressed="false">Suggestions</button></div>
    <select id="fs"><option value="">Any status</option><option value="new">New</option><option value="in_progress">In review</option><option value="resolved">Resolved</option></select>
    <select id="fa"><option value="">All areas</option></select>
    <select id="so"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="urg">Most urgent first</option></select>
  </div>
  <input class="search" id="q" placeholder="Search messages" aria-label="Search messages">
  <div class="cnt" id="cnt"></div>
  <div id="list" style="display:grid;gap:12px"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const AREAS=["Customers and service","Workplace and facilities","Management and team","Systems, printers, tools","Working hours and workload","Procedures and workflow","Other"];
const LBL={new:"New",in_progress:"In review",resolved:"Resolved"},URG={High:0,Medium:1,Low:2};
let items=[],ftype="",drafts={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
async function api(p,body){
  const r=await fetch("/api/"+p,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});
  if(!r.ok)throw new Error(r.status);return r.json();
}
AREAS.forEach(a=>$("#fa").insertAdjacentHTML("beforeend",`<option>${a}</option>`));
async function load(){
  try{items=(await api("admin/list")).items;draw()}
  catch(e){$("#list").innerHTML='<div class="card err">Could not load messages. Check that the site was deployed with the server function.</div>'}
}
function draw(){charts();render()}
function charts(){
  const n=items.length,c=k=>items.filter(i=>i.status===k).length,comp=items.filter(i=>i.type==="complaint").length;
  const urgent=items.filter(i=>i.urgency==="High"&&i.status!=="resolved").length;
  const col={Total:"var(--ink)",New:"var(--blue)","In review":"var(--amber)",Resolved:"var(--green)","Urgent and open":"var(--red)"};
  $("#stats").innerHTML=[["Total",n],["New",c("new")],["In review",c("in_progress")],["Resolved",c("resolved")],["Urgent and open",urgent]].map(([a,b])=>`<div><b>${b}</b><span>${a!=="Total"?`<i class="dot" style="background:${col[a]}"></i>`:""}${a}</span></div>`).join("");
  $("#split").innerHTML=`<div class="tr">${n?`<i style="width:${comp/n*100}%;background:var(--red)"></i><i style="width:${(n-comp)/n*100}%;background:var(--green)"></i>`:""}</div><div class="lg"><span><i class="dot" style="background:var(--red)"></i>Complaints ${comp}</span><span><i class="dot" style="background:var(--green)"></i>Suggestions ${n-comp}</span></div>`;
  const by={};items.forEach(i=>{(by[i.area]=by[i.area]||{c:0,s:0})[i.type==="complaint"?"c":"s"]++});
  const rows=Object.entries(by).sort((a,b)=>(b[1].c+b[1].s)-(a[1].c+a[1].s)),mx=Math.max(1,...rows.map(r=>r[1].c+r[1].s));
  $("#areas").innerHTML=rows.length?rows.map(([a,v])=>`<div class="ar"><span>${esc(a)}</span><div class="t"><i style="width:${v.c/mx*100}%;background:var(--red)"></i><i style="width:${v.s/mx*100}%;background:var(--green)"></i></div><b>${v.c+v.s}</b></div>`).join(""):'<div class="note">No data yet.</div>';
  const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const wk=[...Array(8)].map((_,k)=>{const s=new Date(mon);s.setDate(s.getDate()-7*(7-k));return{s,n:0}});
  items.forEach(i=>{const t=new Date(i.createdAt);for(let k=7;k>=0;k--)if(t>=wk[k].s){wk[k].n++;break}});
  const wm=Math.max(1,...wk.map(w=>w.n));
  $("#weeks").innerHTML=wk.map(w=>`<div><span>${w.n}</span><i style="height:${w.n/wm*100}px"></i><span>${w.s.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span></div>`).join("");
}
function render(){
  const fs=$("#fs").value,fa=$("#fa").value,q=$("#q").value.trim().toLowerCase(),so=$("#so").value;
  let v=items.filter(i=>(!ftype||i.type===ftype)&&(!fs||i.status===fs)&&(!fa||i.area===fa)&&(!q||(i.message+" "+i.code+" "+(i.reply||"")).toLowerCase().includes(q)));
  v.sort((a,b)=>so==="old"?a.createdAt.localeCompare(b.createdAt):so==="urg"?(URG[a.urgency]-URG[b.urgency])||b.createdAt.localeCompare(a.createdAt):b.createdAt.localeCompare(a.createdAt));
  $("#cnt").textContent=`Showing ${v.length} of ${items.length}`;
  $("#list").innerHTML=v.length?v.map(i=>`<div class="card item" data-c="${i.code}"><div class="top"><span class="pill ${i.type}">${i.type==="complaint"?"Complaint":"Suggestion"}</span><span class="pill ${i.urgency}">${i.urgency} urgency</span><span>${esc(i.area)}</span><span>${esc(i.code)}</span><span class="sp"></span><span>${fmt(i.createdAt)}</span></div>
  <div class="msg" dir="auto">${esc(i.message)}</div>
  <div class="act"><div class="seg">${Object.entries(LBL).map(([k,t])=>`<button data-s="${k}" aria-pressed="${i.status===k}">${t}</button>`).join("")}</div>
  <textarea dir="auto" placeholder="Reply to staff (they see this when they check status)" aria-label="Reply">${esc(drafts[i.code]!==undefined?drafts[i.code]:(i.reply||""))}</textarea><button class="del">Delete</button></div></div>`).join(""):'<div class="card empty">No messages match.</div>';
}
async function upd(code,patch){
  try{const r=await api("admin/update",{code,...patch});items=items.map(i=>i.code===code?r.item:i);delete drafts[code];draw()}
  catch(e){alert("Could not save. Check your connection and try again.")}
}
$("#list").addEventListener("click",async e=>{
  const it=e.target.closest(".item");if(!it)return;const code=it.dataset.c;
  const s=e.target.closest("[data-s]");if(s)return upd(code,{status:s.dataset.s});
  if(e.target.closest(".del")&&confirm("Delete this message permanently? Staff will no longer see its status.")){
    try{await api("admin/delete",{code});items=items.filter(i=>i.code!==code);draw()}catch(x){alert("Could not delete. Try again.")}
  }
});
$("#list").addEventListener("input",e=>{if(e.target.matches("textarea"))drafts[e.target.closest(".item").dataset.c]=e.target.value});
$("#list").addEventListener("focusout",e=>{
  if(!e.target.matches("textarea"))return;const code=e.target.closest(".item").dataset.c,cur=items.find(i=>i.code===code);
  if(cur&&e.target.value.trim()!==(cur.reply||""))upd(code,{reply:e.target.value});
});
$("#ft").onclick=e=>{const b=e.target.closest("button");if(!b)return;ftype=b.dataset.v;document.querySelectorAll("#ft button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
["#fs","#fa","#so"].forEach(s=>$(s).onchange=render);$("#q").oninput=render;
load();
setInterval(()=>{if(!document.activeElement.matches("textarea,input"))load()},30000);
</script>
</body>
</html>
